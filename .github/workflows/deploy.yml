name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set. Skipping wrangler deploy."
            exit 0
          fi
          npx wrangler deploy

      - name: IndexNow
        continue-on-error: true
        run: |
          KEY="8f3c1a9e6b274d05a7e0c4d91b6f28aa"
          MARKER="Acquire phxsugarwaxing.com"
          for i in $(seq 1 18); do
            if curl -fsS --max-time 15 "https://phxsugarwaxing.com/acquire/" | grep -q "$MARKER"; then
              echo "live acquire page verified"
              break
            fi
            if [ "$i" = "18" ]; then
              echo "New pages are not live yet. Skipping IndexNow."
              exit 0
            fi
            sleep 10
          done
          curl -fsS --max-time 15 "https://phxsugarwaxing.com/${KEY}.txt" | grep -q "$KEY"
          curl -sS -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"phxsugarwaxing.com\",\"key\":\"${KEY}\",\"keyLocation\":\"https://phxsugarwaxing.com/${KEY}.txt\",\"urlList\":[\"https://phxsugarwaxing.com/\",\"https://phxsugarwaxing.com/acquire/\",\"https://phxsugarwaxing.com/phoenix-sugar-waxing/\"]}"
